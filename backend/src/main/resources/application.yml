spring:
  application:
    name: universe-view
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10,expireAfterWrite=6h

server:
  port: 8080
  compression:
    enabled: true

logging:
  level:
    com.universe_view: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
