spring:
  application:
    name: universe-view
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=50,expireAfterWrite=6h
  datasource:
    url: jdbc:postgresql://localhost:5432/digital_universe
    username: ${DB_USER:universe}
    password: ${DB_PASS:universe}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  compression:
    enabled: true

logging:
  level:
    com.universe: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
